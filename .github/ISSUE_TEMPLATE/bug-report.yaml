---
name: Bug report
description: Report a problem with the Snowsky Echo Mini Toolbox
labels:
  - triage

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Snowsky Echo Mini Toolbox.

        The Go CLI is currently built from source; there are no Go CLI release binaries. Please include the commit you built, or the repository version if known. For issues with the older desktop app, identify its release.

  - type: input
    id: version
    attributes:
      label: Commit or app version
      description: Enter the Git commit hash used to build the CLI, or the desktop app release version.
      placeholder: commit hash or release tag
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Run `go version` if the issue affects the Go CLI.
      placeholder: go1.24.0

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows (x64)
        - Windows (arm64)
        - Linux (x64)
        - Linux (arm64)
        - macOS (x64)
        - macOS (arm64)
        - Other
    validations:
      required: true

  - type: dropdown
    id: feature-affected
    attributes:
      label: Command or feature affected
      options:
        - Scan and compatibility
        - Backup, copy, or move
        - Cleanup or rename
        - Audio conversion
        - Metadata
        - Artwork
        - Lyrics
        - Workflows
        - Older desktop app
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the problem
      description: Include what happened and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Include the command and flags used. Redact private paths and personal information.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include relevant FFmpeg/FFprobe versions and redacted output. Do not upload private or copyrighted media.
      render: shell

---
name: Incompatible music file report
description: Report an incorrect or unclear compatibility result
labels:
  - triage

body:
  - type: markdown
    attributes:
      value: |
        Use this form when `snowsky scan` reports a track as compatible even though it does not work on the device, or when a compatibility result appears incorrect.

        Please do not attach or link to copyrighted audio. A sanitized FFprobe summary is usually enough; remove personal paths and private metadata before posting.

  - type: input
    id: version
    attributes:
      label: CLI commit or version
      description: Enter the Git commit hash used to build the CLI.
      placeholder: commit hash
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows (x64)
        - Windows (arm64)
        - Linux (x64)
        - Linux (arm64)
        - macOS (x64)
        - macOS (arm64)
        - Other
    validations:
      required: true

  - type: input
    id: scan-result
    attributes:
      label: Scan result
      description: Paste the status and reason reported by `snowsky scan`, with private paths removed.
      placeholder: COMPATIBLE — ...
    validations:
      required: true

  - type: textarea
    id: file-details
    attributes:
      label: Sanitized file details
      description: Include the extension, codec, sample rate, bit depth, channel count, and a sanitized FFprobe summary if available. Do not attach the audio file.
      render: shell
    validations:
      required: true

  - type: textarea
    id: device-result
    attributes:
      label: Device behavior
      description: Describe what happened on the Snowsky Echo Mini, including firmware version if known.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
